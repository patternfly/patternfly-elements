---
description: Without href, the component renders as a button and scrolls to the top via JavaScript.
---
<style>
  #wrapper {
    position: relative;
    height: 100vh;
  }
  #container {
    height: 100%;
    overflow-y: auto;
  }
</style>

<div id="wrapper">
  <div id="container">
    <div style="padding: 1rem;">
      <h2>Button mode</h2>
      <p>Without <code>href</code>, the component renders as a button and scrolls via JavaScript.</p>
    </div>
    <div style="height: 1200px;"></div>
  </div>
  <pf-v6-back-to-top scrollable-selector="#container">Back to top</pf-v6-back-to-top>
</div>

<script type="module">
  import '@patternfly/elements/pf-v6-back-to-top/pf-v6-back-to-top.js';
</script>
