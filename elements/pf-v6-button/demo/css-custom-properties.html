---

  <pf-v6-button class="themed">Themed primary</pf-v6-button>
  <pf-v6-button class="themed" variant="secondary">Themed secondary</pf-v6-button>
</section>

<script type="module">

  .themed {

    --pf-v6-c-button--m-secondary--Color: #3d2c02;
    --pf-v6-c-button--m-secondary--BorderColor: #3d2c02;
    --pf-v6-c-button--m-secondary--hover--Color: #5c4403;
    --pf-v6-c-button--m-secondary--hover--BorderColor: #5c4403;
