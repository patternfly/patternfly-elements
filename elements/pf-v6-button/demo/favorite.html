---
name: Favorite
description: Favorite buttons use the favorite attribute with variant="plain". Toggle favorited to update the filled star state.
---

<section>
  <pf-v6-button
    id="fav"
    variant="plain"
    favorite
    accessible-label="not starred"
  ></pf-v6-button>
  <pf-v6-button
    id="fav-on"
    variant="plain"
    favorite
    favorited
    accessible-label="starred"
  ></pf-v6-button>
</section>

<script type="module">
  import '@patternfly/elements/pf-v6-button/pf-v6-button.js';

  for (const button of document.querySelectorAll("pf-v6-button")) {
    button.addEventListener("click", () => {
      button.favorited = !button.favorited;
      button.accessibleLabel = button.favorited ? "starred" : "not starred";
    });
  }
</script>

<style>
section {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }
</style>
