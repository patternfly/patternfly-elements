---
name: Progress indicators
description: Set loading to show a progress spinner after the user starts an action. Use loading="false" to reserve progress padding without a spinner.
---

<section>
  <pf-v6-button id="primary" loading>Click to stop loading</pf-v6-button>
  <pf-v6-button id="secondary" variant="secondary" loading
    >Click to stop loading</pf-v6-button
  >
  <pf-v6-button id="plain" variant="plain" accessible-label="Upload">
    <svg
      slot="icon"
      fill="currentColor"
      height="1em"
      width="1em"
      viewBox="0 0 512 512"
      aria-hidden="true"
    >
      <path
        d="M296 384h-80c-13.3 0-24-10.7-24-24V192h-87.7c-17.8 0-26.7-21.5-14.1-34.1L242.3 5.7c7.5-7.5 19.8-7.5 27.3 0l152.2 152.2c12.6 12.6 3.7 34.1-14.1 34.1H320v168c0 13.3-10.7 24-24 24zm216-8v112c0 13.3-10.7 24-24 24H24c-13.3 0-24-10.7-24-24V376c0-13.3 10.7-24 24-24h136v8c0 30.9 25.1 56 56 56h80c30.9 0 56-25.1 56-56v-8h136c13.3 0 24 10.7 24 24zm-124 88c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20zm64 0c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20z"
      ></path>
    </svg>
  </pf-v6-button>
  <pf-v6-button id="inline" variant="link" inline loading
    >Pause loading logs</pf-v6-button
  >
</section>

<script type="module">
  import '@patternfly/elements/pf-v6-button/pf-v6-button.js';

  for (const button of document.querySelectorAll('pf-v6-button')) {
    button.addEventListener('click', () => {
      // Toggle between true and false so progress padding stays reserved
      // (React isLoading tri-state; avoid returning to null).
      button.loading = button.loading !== true;
      if (button.id === 'plain') {
        return;
      }
      if (button.id === 'inline') {
        button.textContent =
          button.loading === true ? 'Pause loading logs' : 'Resume loading logs';
        return;
      }
      button.textContent =
        button.loading === true ?
          'Click to stop loading'
        : 'Click to start loading';
    });
  }
</script>

<style>
section {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }
</style>
