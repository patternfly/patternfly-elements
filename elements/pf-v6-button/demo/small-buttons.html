---
name: Small buttons
description: Every button variant can use size="sm" to fit tight spaces.
---

<section>
  <pf-v6-button size="sm">Primary</pf-v6-button>
  <pf-v6-button size="sm" variant="secondary">Secondary</pf-v6-button>
  <pf-v6-button size="sm" variant="secondary" danger>Secondary danger</pf-v6-button>
  <pf-v6-button size="sm" variant="tertiary">Tertiary</pf-v6-button>
  <pf-v6-button size="sm" variant="danger">Danger</pf-v6-button>
  <pf-v6-button size="sm" variant="warning">Warning</pf-v6-button>
</section>

<section>

  <pf-v6-button size="sm" variant="link" inline>Inline link</pf-v6-button>

      slot="icon"
      fill="currentColor"
      height="1em"
      width="1em"
      viewBox="0 0 20 20"
      aria-hidden="true"
    >
      <path
        d="M17.8 16.2 11.59 10l6.21-6.21c.42-.46.39-1.17-.07-1.59-.43-.4-1.09-.4-1.52 0l-6.2 6.2-6.22-6.19c-.44-.44-1.15-.44-1.59 0-.44.44-.44 1.15 0 1.59l6.2 6.21-6.2 6.2c-.42.46-.39 1.17.07 1.59.43.4 1.09.4 1.52 0L10 11.59l6.2 6.2c.44.44 1.15.44 1.59 0 .44-.45.44-1.16 0-1.6Z"
