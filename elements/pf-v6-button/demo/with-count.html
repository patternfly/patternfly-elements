---
name: Button with count
description: Slot a badge into count to show a numeric value beside the button label.
---

<section>
  <pf-v6-button>
    Issues
    <pf-v6-badge slot="count" state="unread">7</pf-v6-badge>
  </pf-v6-button>
  <pf-v6-button variant="secondary">
    Issues
    <pf-v6-badge slot="count" state="read">7</pf-v6-badge>
  </pf-v6-button>
  <pf-v6-button disabled>
    Issues
    <pf-v6-badge slot="count" state="unread">7</pf-v6-badge>
  </pf-v6-button>
</section>

<script type="module">
  import '@patternfly/elements/pf-v6-button/pf-v6-button.js';
  import '@patternfly/elements/pf-v6-badge/pf-v6-badge.js';
</script>
