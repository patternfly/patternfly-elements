---
name: Card with header that wraps
description: Use header-wrap to allow long titles and multiple actions to wrap onto multiple rows.
---
<!-- TODO: replace native <button> elements with <pf-v6-button> once it ships (PR #3157). -->
<pf-v6-card header-wrap>
  <h2 slot="header">This is a longer card title that takes up more space</h2>
  <button slot="actions" type="button">Primary action</button>
  <button slot="actions" type="button">Secondary action</button>
  <button slot="actions" type="button">Tertiary action</button>
  <pf-v6-card-body>This is the card body</pf-v6-card-body>
</pf-v6-card>

<script type="module">
  import '@patternfly/elements/pf-v6-card/pf-v6-card.js';
</script>

<style>
  pf-v6-card {
    max-inline-size: 30rem;
    margin: 1rem;
  }

  [slot="actions"] {
    padding: 0.25rem 0.75rem;
    font: inherit;
    font-size: 0.875rem;
    color: inherit;
    background: transparent;
    border: 1px solid currentColor;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
