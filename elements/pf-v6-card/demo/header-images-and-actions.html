---
name: Header images and actions
description: Include header actions with the actions slot. Use no-offset to remove the negative margin that helps align default-sized card titles with card actions.
---
<!-- TODO: replace native <button> elements with <pf-v6-button> once it ships (PR #3157). -->
<label class="toggle">
  <input type="checkbox" id="no-offset"> actions has no offset
</label>
<pf-v6-card>
  <svg slot="header"
       viewBox="0 0 300 60"
       width="300"
       height="60"
       role="img"
       aria-label="PatternFly logo">
    <rect width="300" height="60" rx="6" fill="#0066cc"></rect>
    <text x="150" y="37" text-anchor="middle" fill="#ffffff" font-size="20">PatternFly</text>
  </svg>
  <button slot="actions" type="button" aria-label="Actions" class="icon-button">
    <svg viewBox="0 0 16 16" width="1em" height="1em" fill="currentColor" aria-hidden="true">
      <circle cx="8" cy="3" r="1.5"></circle>
      <circle cx="8" cy="8" r="1.5"></circle>
      <circle cx="8" cy="13" r="1.5"></circle>
    </svg>
  </button>
  <input slot="actions" type="checkbox" aria-label="Example checkbox">
  <h2 slot="title">Title</h2>
  <pf-v6-card-body>Body</pf-v6-card-body>
  <span slot="footer">Footer</span>
</pf-v6-card>

<script type="module">
  import '@patternfly/elements/pf-v6-card/pf-v6-card.js';

  const card = document.querySelector('pf-v6-card');
  const toggle = document.getElementById('no-offset');
  toggle.addEventListener('change', () => {
    card.toggleAttribute('no-offset', toggle.checked);
  });
</script>

<style>
  .toggle {
    display: inline-flex;
    gap: 0.5rem;
    align-items: center;
    margin: 1rem 1rem 0;
  }

  pf-v6-card {
    max-inline-size: 22rem;
    margin: 1rem;
  }

  [slot="actions"] {
    accent-color: #0066cc;
  }

  .icon-button {
    display: inline-flex;
    padding: 0.5rem;
    color: inherit;
    background: none;
    border: 0;
    border-radius: 0.25rem;
    cursor: pointer;
  }
</style>
