---
name: Disabled
description: A disabled text input prevents user interaction.
---
<fieldset>
  <legend>Disabled</legend>
  <pf-v6-text-input disabled
                    accessible-label="disabled text input"
                    value="disabled text input example"></pf-v6-text-input>
</fieldset>

<fieldset id="disablable-fieldset" disabled>
  <legend>Disabled by fieldset</legend>
  <pf-v6-text-input accessible-label="disabled by fieldset"
                    value="disabled by a fieldset example"></pf-v6-text-input>
</fieldset>

<label>Disable the fieldset
  <pf-v6-switch id="disabled-fieldset-switch" checked></pf-v6-switch>
</label>

<script type="module">
  import '@patternfly/elements/pf-v6-text-input/pf-v6-text-input.js';
  import '@patternfly/elements/pf-v6-switch/pf-v6-switch.js';
  document.getElementById('disabled-fieldset-switch')
    .addEventListener('change', function() {
      document.getElementById('disablable-fieldset').disabled = this.checked;
    });
</script>

<link rel="stylesheet" href="demo.css">

<style>
  label {
    display: flex;
    gap: 1em;
    margin-block: 1em;
  }
</style>
