---
name: Select text using ref
description: Demonstrates programmatic text selection using the select() method.
---
<fieldset>
  <legend>Select text using ref</legend>
  <label for="selectable">Click to select all</label>
  <pf-v6-text-input id="selectable"
                    value="select all on click"></pf-v6-text-input>
</fieldset>

<script type="module">
  import '@patternfly/elements/pf-v6-text-input/pf-v6-text-input.js';
  document.getElementById('selectable')
    .addEventListener('focus', function() { this.select(); });
</script>

<link rel="stylesheet" href="demo.css">
