---
name: Custom tooltip
description: >
  Display any custom content within a tooltip by placing it in the tooltip's
  content slot. Use an anchor element around the trigger for keyboard
  accessibility.
---
<section>
  <p>
    <pf-v5-tooltip>
      <a href="#">
        <pf-v6-timestamp date="Tue Aug 09 2022 14:57:00 GMT-0400 (Eastern Daylight Time)"></pf-v6-timestamp>
      </a>
      <span slot="content">Last updated on <pf-v6-timestamp date="Tue Aug 09 2022 14:57:00 GMT-0400 (Eastern Daylight Time)" date-format="long" time-format="short" time-zone="UTC"></pf-v6-timestamp></span>
    </pf-v5-tooltip>
  </p>
  <p>
    <pf-v5-tooltip>
      Halloween
      <pf-v6-timestamp slot="content" date="Mon Oct 31 2022 00:00:00 GMT-0400 (Eastern Daylight Time)" date-format="medium"></pf-v6-timestamp>
    </pf-v5-tooltip>
  </p>
</section>

<script type="module">
  import '@patternfly/elements/pf-v6-timestamp/pf-v6-timestamp.js';
  import '@patternfly/elements/pf-v5-tooltip/pf-v5-tooltip.js';
</script>
