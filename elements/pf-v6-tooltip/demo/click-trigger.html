---
description: Click-to-toggle tooltip using cancelable show and hide events.
---
<section>
  <pf-v6-tooltip id="click-tooltip"
                 content="This tooltip toggles on click."
                 entry-delay="0"
                 exit-delay="0">
    <pf-v5-button>Click me</pf-v5-button>
  </pf-v6-tooltip>
</section>

<script type="module">
  import '@patternfly/elements/pf-v5-button/pf-v5-button.js';
  import '@patternfly/elements/pf-v6-tooltip/pf-v6-tooltip.js';

  const tooltip = document.getElementById('click-tooltip');
  let clickOpen = false;

  tooltip.addEventListener('show', function(event) {
    if (event.reason !== 'mouseenter') {
      return;
    }
    // Prevent hover from opening; only allow click
    event.preventDefault();
  });

  tooltip.addEventListener('hide', function(event) {
    if (clickOpen && event.reason === 'mouseleave') {
      // Prevent mouseleave from closing when opened by click
      event.preventDefault();
    }
  });

  tooltip.querySelector('pf-v5-button').addEventListener('click', function() {
    clickOpen = !clickOpen;
    if (clickOpen) {
      tooltip.show();
    } else {
      tooltip.hide();
      clickOpen = false;
    }
  });
</script>
