---
description: Manually controlled tooltip using show() and hide() methods.
---
<section>
  <label>
    <input id="toggle" type="checkbox"> Show tooltip
  </label>
</section>

<section class="demo-area">
  <pf-v6-tooltip id="manual-tooltip"
                 content="Manually controlled tooltip.">
    <pf-v5-button>Target element</pf-v5-button>
  </pf-v6-tooltip>
</section>

<script type="module">
  import '@patternfly/elements/pf-v5-button/pf-v5-button.js';
  import '@patternfly/elements/pf-v6-tooltip/pf-v6-tooltip.js';

  const tooltip = document.getElementById('manual-tooltip');
  const toggle = document.getElementById('toggle');

  // Prevent default hover/focus triggers
  tooltip.addEventListener('show', function(event) {
    event.preventDefault();
  });

  tooltip.addEventListener('hide', function(event) {
    event.preventDefault();
  });

  toggle.addEventListener('change', function() {
    if (toggle.checked) {
      tooltip.show();
    } else {
      tooltip.hide();
    }
  });
</script>

<style>
  .demo-area {
    padding: 4em 2em;
    text-align: center;
  }
</style>
